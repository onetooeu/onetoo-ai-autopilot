name: autopilot-ams-ingest

on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (UTC)

permissions:
  contents: write

concurrency:
  group: autopilot-ams-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Ingest AMS contrib_submit
        env:
          AMS_BASE_URL: https://portal.onetoo.eu
          AMS_LIMIT: "200"
        run: npm run ingest:ams

      - name: Commit updated artifacts (if changed)
        run: |
          git status --porcelain
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "onetoo-autopilot-bot"
            git config user.email "actions@users.noreply.github.com"
            git add -A
            git commit -m "autopilot: ingest ams contrib_submit (scheduled)"
            git push
          else
            echo "No changes"
          fi
