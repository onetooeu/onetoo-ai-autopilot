name: "Autopilot: apply proposal + multi-sig sign"

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: signing-multisig-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  apply_and_sign:
    # run only if issue has label "proposal" (works for both opened and labeled events)
    if: contains(github.event.issue.labels.*.name, 'proposal')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write proposal from issue body
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proposals

          # Write issue body as JSON file content (verbatim)
          # NOTE: this assumes the issue body is valid JSON
          cat > "proposals/issue-${{ github.event.issue.number }}.json" <<'JSON'
          ${{ github.event.issue.body }}
          JSON

          # Optional: validate JSON early (fails fast with readable error)
          node -e "JSON.parse(require('fs').readFileSync('proposals/issue-${{ github.event.issue.number }}.json','utf8')); console.log('OK JSON')"

      - name: Apply proposal
        shell: bash
        run: |
          set -euo pipefail
          node ./scripts/apply-proposal.js "proposals/issue-${{ github.event.issue.number }}.json"

      - name: Download minisign
        shell: bash
        run: |
          set -euo pipefail
          curl -L -o minisign.tar.gz "https://github.com/jedisct1/minisign/releases/download/0.11/minisign-0.11-linux.tar.gz"
          tar -xzf minisign.tar.gz
          sudo mv minisign-linux/minisign /usr/local/bin/minisign
          minisign -V || true

      - name: Sign stable artifact (autopilot)
        shell: bash
        env:
          MINISIGN_AUTOPILOT_SECRET: ${{ secrets.MINISIGN_AUTOPILOT_SECRET }}
        run: |
          set -euo pipefail
          test -n "${MINISIGN_AUTOPILOT_SECRET:-}" || (echo "Missing secret MINISIGN_AUTOPILOT_SECRET" && exit 1)
          test -f "data/stable/contrib-accepted.v2.json" || (echo "Missing file data/stable/contrib-accepted.v2.json" && exit 1)

          umask 077
          printf "%s" "$MINISIGN_AUTOPILOT_SECRET" > /tmp/autopilot.key
          minisign -S -s /tmp/autopilot.key \
            -m data/stable/contrib-accepted.v2.json \
            -x data/stable/contrib-accepted.v2.json.minisig

      - name: Sign stable artifact (root)
        shell: bash
        env:
          MINISIGN_ROOT_SECRET: ${{ secrets.MINISIGN_ROOT_SECRET }}
        run: |
          set -euo pipefail
          test -n "${MINISIGN_ROOT_SECRET:-}" || (echo "Missing secret MINISIGN_ROOT_SECRET" && exit 1)
          test -f "data/stable/contrib-accepted.v2.json" || (echo "Missing file data/stable/contrib-accepted.v2.json" && exit 1)

          umask 077
          printf "%s" "$MINISIGN_ROOT_SECRET" > /tmp/root.key
          minisign -S -s /tmp/root.key \
            -m data/stable/contrib-accepted.v2.json \
            -x data/stable/contrib-accepted.v2.json.root.minisig

      - name: Commit and push (only if changes)
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "onetoo-autopilot"
          git config user.email "autopilot@users.noreply.github.com"

          # Stage only intended outputs
          git add data/stable data/sandbox proposals/*.json || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "autopilot: apply proposal #${{ github.event.issue.number }}"
          git push

      - name: Comment + close issue
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.payload.issue.number;
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number,
              body: '✅ Proposal applied. Stable artifact updated and multi-signed.'
            });
            await github.rest.issues.update({
              ...context.repo,
              issue_number,
              state: 'closed'
            });