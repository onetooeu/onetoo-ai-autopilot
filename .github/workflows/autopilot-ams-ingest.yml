name: autopilot-ams-ingest

on:
  workflow_dispatch:
    inputs:
      ams_base_url:
        description: "AMS base URL"
        required: true
        default: "https://portal.onetoo.eu"
      ams_limit:
        description: "Max items per run"
        required: true
        default: "200"
  schedule:
    - cron: "*/10 * * * *" # every 10 minutes (UTC)

permissions:
  contents: write

concurrency:
  group: autopilot-ams-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest

    env:
      AMS_BASE_URL: ${{ github.event.inputs.ams_base_url || 'https://portal.onetoo.eu' }}
      AMS_LIMIT: ${{ github.event.inputs.ams_limit || '200' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Ingest AMS contrib_submit (pre)
        run: npm run ingest:ams

      - name: Commit updated artifacts (no-churn, hard-sync safe)
        shell: bash
        run: |
          set -euo pipefail

          # If no JSON changes, exit early (prevents cursor-only churn)
          if git diff --quiet -- data/ams/*.json; then
            echo "No JSON artifact changes in data/ams"
            exit 0
          fi

          git config user.name "onetoo-autopilot-bot"
          git config user.email "actions@users.noreply.github.com"

          # HARD sync to origin/main to avoid rebase failures from CRLF/eol or other unstaged changes
          git fetch origin main
          git reset --hard origin/main
          git clean -fdx

          # Re-create outputs on top of the latest origin/main
          npm ci
          npm run ingest:ams

          # Commit only intended outputs (JSON + cursor)
          git add data/ams/*.json data/ams/lastCursor.txt

          # Nothing to commit after hard-sync + rerun? then exit cleanly
          if git diff --cached --quiet; then
            echo "Nothing staged after hard-sync rerun; skipping commit"
            exit 0
          fi

          git commit -m "autopilot: ingest ams contrib_submit (scheduled)"
          git push
