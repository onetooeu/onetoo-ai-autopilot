name: autopilot-ams-ingest

on:
  workflow_dispatch:
    inputs:
      ams_base_url:
        description: "AMS base URL"
        required: true
        default: "https://portal.onetoo.eu"
      ams_limit:
        description: "Max items per run"
        required: true
        default: "200"
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (UTC)

permissions:
  contents: write

concurrency:
  group: autopilot-ams-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Ingest AMS contrib_submit
        env:
          AMS_BASE_URL: ${{ inputs.ams_base_url || 'https://portal.onetoo.eu' }}
          AMS_LIMIT: ${{ inputs.ams_limit || '200' }}
        run: npm run ingest:ams

      - name: Commit updated artifacts (only if JSON artifacts changed)
        shell: bash
        run: |
          set -euo pipefail

          # Commit only if JSON outputs changed (prevents cursor-only churn)
          if git diff --quiet -- data/ams/*.json; then
            echo "No JSON artifact changes in data/ams"
            exit 0
          fi

          git config user.name "onetoo-autopilot-bot"
          git config user.email "actions@users.noreply.github.com"

          # Ensure clean tree for pull --rebase (stash EVERYTHING just in case)
          git add -A
          git stash push -u -m "autopilot-prepull" || true

          # Sync with origin (another run may have pushed)
          git fetch origin main
          git pull --rebase origin main

          # Restore changes (if any)
          git stash pop || true

          # Add only intended outputs (JSON + cursor)
          git add data/ams/*.json data/ams/lastCursor.txt

          # In rare cases stash pop may bring no staged changes
          if git diff --cached --quiet; then
            echo "Nothing staged after sync; skipping commit"
            exit 0
          fi

          git commit -m "autopilot: ingest ams contrib_submit (scheduled)"
          git push